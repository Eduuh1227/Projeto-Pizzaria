<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Administração | Pizzaria Realeza</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/admin/vendor/lucide.js" defer></script>
  <script src="/admin/admin.js" defer></script>
</head>
<body>
  <main id="login-view" class="login-shell">
    <form id="login-form" class="login-form">
      <div class="brand"><span class="monogram">RZ</span><span>Pizzaria Realeza<small>Administração</small></span></div>
      <h1>Acesso da equipe</h1>
      <label>E-mail<input type="email" name="email" autocomplete="username" maxlength="254" required></label>
      <label>Senha<input type="password" name="password" autocomplete="current-password" maxlength="256" required></label>
      <p id="login-error" class="error" role="alert"></p>
      <button class="primary" type="submit"><i data-lucide="log-in"></i><span>Entrar</span></button>
    </form>
  </main>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand"><span class="monogram">RZ</span><span>Pizzaria Realeza<small>Administração</small></span></div>
      <div class="account"><span id="account-email"></span><button id="logout" class="icon-button" title="Sair" aria-label="Sair"><i data-lucide="log-out"></i></button></div>
    </header>
    <main class="workspace">
      <div class="page-heading"><div><p class="eyebrow">Operação</p><h1>Pedidos</h1></div><div class="sync"><span id="sync-time" role="status"></span><button id="refresh" class="icon-button" title="Atualizar pedidos" aria-label="Atualizar pedidos"><i data-lucide="refresh-cw"></i></button></div></div>
      <p id="app-error" class="error" role="alert" hidden></p>
      <nav id="status-filters" class="status-filters" aria-label="Filtrar por status"></nav>
      <form id="filters" class="filters" role="search">
        <label class="search">Buscar pedido<div class="input-icon"><i data-lucide="search"></i><input name="search" type="search" maxlength="100" placeholder="Nome, telefone ou número do pedido"></div></label>
        <label>Data<input name="date" type="date" aria-label="Data dos pedidos"></label>
        <button type="button" id="clear-filters" class="quiet">Limpar filtros</button>
      </form>
      <div class="list-heading"><h2 id="list-title">Todos os pedidos</h2><span id="result-count"></span></div>
      <div class="table-wrap">
        <table aria-labelledby="list-title">
          <thead><tr><th>Pedido</th><th>Cliente</th><th>Recebimento</th><th>Status</th><th class="align-right">Total</th><th><span class="sr-only">Detalhes</span></th></tr></thead>
          <tbody id="orders"></tbody>
        </table>
        <div id="empty" class="empty" role="status"><i data-lucide="clipboard-list"></i><h3>Nenhum pedido encontrado</h3></div>
      </div>
      <footer class="pagination"><span id="page-label"></span><div><button id="previous" class="icon-button" aria-label="Página anterior" title="Página anterior"><i data-lucide="chevron-left"></i></button><button id="next" class="icon-button" aria-label="Próxima página" title="Próxima página"><i data-lucide="chevron-right"></i></button></div></footer>
    </main>
  </div>

  <dialog id="detail" aria-labelledby="detail-title">
    <header class="detail-header"><div><p class="eyebrow">Pedido</p><h2 id="detail-title"></h2></div><button id="close-detail" class="icon-button" title="Fechar detalhes" aria-label="Fechar detalhes"><i data-lucide="x"></i></button></header>
    <div id="detail-body"></div>
    <p id="detail-error" class="error" role="alert"></p>
    <form id="status-form" class="status-form" hidden>
      <label>Atualizar status<select id="next-status" required></select></label>
      <label id="cancel-field" hidden>Motivo do cancelamento<textarea id="cancel-note" rows="3" maxlength="500"></textarea></label>
      <button class="primary" type="submit"><i data-lucide="check"></i><span>Salvar status</span></button>
    </form>
  </dialog>
  <div id="notice" class="notice" role="status" hidden></div>
</body>
</html>
